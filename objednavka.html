<!doctype html>
<html lang="sk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe6">
  <meta name="description" content="Dokončite objednávku v rýchlej pokladni LUXE.">
  <title>LUXE — Objednávka</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="checkout-header">
    <a class="wordmark" href="index.html" aria-label="LUXE — hlavná stránka">LUXE</a>
    <a class="back-link" href="index.html"><span aria-hidden="true">←</span> SPÄŤ</a>
  </header>

  <main class="checkout-main">
    <div class="checkout-heading">
      <p class="eyebrow">LUXE <span class="eyebrow-divider">/</span> Rýchly a jednoduchý nákup</p>
      <h1>Objednávka<span class="period">.</span></h1>
    </div>

    <div class="checkout-layout">
      <section class="checkout-review" aria-labelledby="checkout-items-title">
        <div class="checkout-section-heading">
          <h2 id="checkout-items-title">Váš výber</h2>
          <span class="eyebrow">01 <span class="eyebrow-divider">/</span> Produkty</span>
        </div>
        <ul class="checkout-items" id="checkout-items" aria-live="polite"></ul>
        <p class="checkout-empty" id="checkout-empty" hidden>Váš košík je prázdny. Vráťte sa do katalógu a vyberte si produkty.</p>
        <div class="checkout-total">
          <span>CENA</span>
          <strong id="checkout-total">0,00 €</strong>
        </div>
      </section>

      <section class="checkout-form-section" aria-labelledby="checkout-form-title">
        <p class="eyebrow">02 <span class="eyebrow-divider">/</span> Vaše údaje</p>
        <h2 id="checkout-form-title">RÝCHLA POKLADŇA</h2>
        <form class="checkout-form" id="checkout-form">
          <label class="checkout-field" for="checkout-name">
            Meno
            <input id="checkout-name" name="name" type="text" autocomplete="name" required>
          </label>
          <label class="checkout-field" for="checkout-phone">
            Telefón
            <input id="checkout-phone" name="phone" type="tel" autocomplete="tel" required>
          </label>
          <label class="checkout-field" for="checkout-address">
            Adresa
            <input id="checkout-address" name="address" type="text" autocomplete="street-address" required>
          </label>
          <label class="checkout-field" for="checkout-email">
            E-mail
            <input id="checkout-email" name="email" type="email" autocomplete="email" required>
          </label>

          <fieldset class="payment-method">
            <legend>Spôsob platby</legend>
            <label><input type="radio" name="payment" value="card" checked> Karta</label>
            <label><input type="radio" name="payment" value="cod"> Dobierka</label>
          </fieldset>

          <button class="checkout-button checkout-submit" type="submit">Dokončiť objednávku</button>
        </form>
        <p class="checkout-confirmation" id="order-confirmation" role="status" aria-live="polite" hidden></p>
      </section>
    </div>
  </main>
</body>
</html>
